#.schema https://panache.bz/reference/panache.schema.json
cache = true
flavor = "quarto"

[flavor-overrides]
"**/README.md" = "gfm"

# https://jolars.github.io/panache/configuration.html#extensions
[extensions]
citations = false
emoji = true
task-lists = true

[extensions.gfm]
task-lists = true
multiline-tables = true

[format]
horizontal-rule-style = "preserve"
line-width = 120
line-ending = "lf"
wrap = "reflow"  # Options: "reflow", "preserve", "sentence", "semantic"
lang = "en"
math-delimiter-style = "preserve"
tab-stops = "normalize"
tab-width = 4

[formatters]
python = "ruff"
r = "air"

[linters]
python = "ruff"
r = "jarl"
yaml = "yamllint"
csharp = "csharpier"

[lint.rules]
heading-hierarchy = true
duplicate-reference-labels = true
undefined-references = true
citation-keys = false
chunk-label-spaces = true
missing-chunk-labels = true
unknown-emoji-alias = true
